pre-commit:
  # Piped: every job stages the files it fixed, and concurrent `git add` races on index.lock.
  piped: true
  jobs:
    # The root .prettierignore skips the workspaces; each one formats its files with its own config.
    - name: fmt
      glob: &formatted '*.{astro,svelte,js,ts,json,css,html,md,yaml,yml}'
      run: &prettier bunx --bun --no-install prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    - name: fmt (app)
      root: packages/app/
      glob: *formatted
      run: *prettier
      stage_fixed: true
    - name: fmt (ui)
      root: packages/ui/
      glob: *formatted
      run: *prettier
      stage_fixed: true
    - name: fmt (tools)
      root: tools/
      glob: *formatted
      run: *prettier
      stage_fixed: true
    # THIRD_PARTY_NOTICES.md follows the dependencies; CI on main fails when it is stale.
    - name: notices
      glob:
        - 'package.json'
        - 'packages/*/package.json'
        - 'bun.lock'
      run: bun run notices && git add THIRD_PARTY_NOTICES.md
    - name: license
      glob: '*.{astro,cjs,css,html,js,mjs,sh,svelte,toml,ts,yaml,yml}'
      run: bun run check:license
    # The repository is public: a key that lands in a commit stays in its history. CI scans with gitleaks;
    # locally, gitleaks when it is installed, otherwise secretlint from the dev dependencies.
    - name: secrets
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --pre-commit --staged --redact --no-banner
        else
          bunx --bun --no-install secretlint --secretlintignore .gitignore {staged_files}
        fi

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check
    - name: lint
      run: bun run lint
