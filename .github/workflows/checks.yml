# The fast part of the check list on every pull request; ci.yml runs all of it on main.
name: Checks

on:
  pull_request:
  # notices.yml dispatches a run after pushing regenerated notices: a GITHUB_TOKEN push starts none.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type-check, test, format, lint and licence headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before lint: astro check generates the types the linter reads.
      - name: Type-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Licence headers
        run: bun run check:license

  secrets:
    name: Secret scan
    uses: ./.github/workflows/secrets.yml
