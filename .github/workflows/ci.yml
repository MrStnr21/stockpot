# The full check list, the build, the end-to-end suite and the secret scan on every pull request and
# every push to main. The main ruleset requires these jobs, so a pull request merges only when the
# build and the suite pass, not only the fast checks. The whole run takes about a minute.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # notices.yml dispatches a run after pushing regenerated notices: a GITHUB_TOKEN push starts none.
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request supersedes the running checks; a push to main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      # The whole history: the migration check needs main, the merge base with it, and HEAD^.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Before lint: astro check generates the types the linter reads.
      - name: Type-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Licence headers
        run: bun run check:license

      - name: Links in the docs
        run: bun run check:links

      # A push to main is one squash commit, checked against the commit before it.
      - name: Migrations on main unchanged
        run: bun run check:migrations ${{ github.event_name == 'push' && '-- --push' || '' }}

      # On pull requests notices.yml regenerates the file instead.
      - name: Third-party notices up to date
        if: github.event_name != 'pull_request'
        run: bun run notices -- --check

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Build and run both suites
        run: bun run e2e

      - name: Upload the Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/app/playwright-report/
            packages/ui/playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    uses: ./.github/workflows/secrets.yml
